{% extends "base.html" %}
{% block title %}登录 — ProAlas{% endblock %}
{% block body_class %}page-login{% endblock %}
{% block body %}
<div class="login-scene">
  <canvas id="login-terminal-canvas" class="login-terminal-canvas" aria-hidden="true"></canvas>
  <div class="login-scene-vignette" aria-hidden="true"></div>
  {% include "_theme_select.html" %}
  <div class="login-card">
    <p class="login-eyebrow">ProAlas</p>
    <h1>设备登录</h1>
    <p class="muted">选择与 Alas 配置文件名一致的设备号；<strong>默认无密码，直接点进入</strong>。</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('auth.login') }}" id="login-form">
      <label>设备 / 配置名</label>
      <select name="device_id" required>
        {% for d in devices %}
        <option value="{{ d }}" {% if device_id == d %}selected{% endif %}>{{ d }}</option>
        {% endfor %}
      </select>
      <label>密码（可选）</label>
      <input type="password" name="password" placeholder="无密码则留空" autocomplete="current-password" />
      <button type="submit">进入</button>
    </form>
  </div>
</div>
<script src="{{ url_for('static', filename='login_terminal.js') }}" defer></script>
{% endblock %}
