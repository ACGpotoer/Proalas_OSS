{% extends "base.html" %}
{% block title %}管理员 — ProAlas{% endblock %}
{% block body_class %}page-login{% endblock %}
{% block body %}
<div class="login-scene">
  <canvas id="login-terminal-canvas" class="login-terminal-canvas" aria-hidden="true"></canvas>
  <div class="login-scene-vignette" aria-hidden="true"></div>
  {% include "_theme_select.html" %}
  <div class="login-card">
    <p class="login-eyebrow">ProAlas</p>
    <h1>管理员登录</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('admin.admin_login') }}">
      <label>用户名</label>
      <input name="username" required autocomplete="username" />
      <label>密码</label>
      <input type="password" name="password" required autocomplete="current-password" />
      <button type="submit">进入</button>
    </form>
    <p class="hint"><a href="{{ url_for('auth.login') }}">返回设备登录</a></p>
  </div>
</div>
<script src="{{ url_for('static', filename='login_terminal.js') }}" defer></script>
{% endblock %}
